function save(){localStorage.setItem('papa_senda_builder_v7',JSON.stringify(state))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function js(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function energyCost(){const n=state.structure.energies.length;return n<=1?0:n===2?4:10}function pcs(){return energyCost()+profiles[state.structure.profile].cost}function psAvail(){return 40-profiles[state.structure.profile].cost}function psUsed(){return state.skills.reduce((a,s)=>a+(Number(s.ps)||0),0)}function equipTotal(){return state.equipment.reduce((a,e)=>a+(Number(e.cost)||0),0)}
function validate(){const bad=[],warn=[],ok=[];if(!state.identity.name)bad.push('Falta nombre de la Senda.');if(!state.identity.fantasy)bad.push('Falta fantasía central.');if(state.structure.energies.length<1)bad.push('Debes elegir al menos 1 Energía.');if(state.concepts.length!==3)bad.push('Debes elegir exactamente 3 Conceptos.');if(state.affines.length!==3)bad.push('Debes elegir exactamente 3 afines.');if(state.opposed.length!==2)bad.push('Debes elegir exactamente 2 contrarias.');if(state.skills.some(s=>!s.name))bad.push('Las 7 habilidades deben tener nombre.');if(state.skills.filter(s=>s.type==='Pasiva').length<2)bad.push('La Senda debe tener al menos 2 Pasivas.');if(state.skills.filter(s=>s.type==='Acción').length<2)bad.push('La Senda debe tener al menos 2 habilidades de Acción.');state.skills.forEach(s=>{if((Number(s.ps)||0)>s.cap)bad.push(`${s.slot} supera su techo de ${s.cap} PS.`);const t=`${s.when} ${s.does} ${s.desc}`.toLowerCase();if(t.includes('escena'))bad.push(`${s.slot} usa “escena”. Reemplaza por ronda, combate, descanso, jornada o condición.`);if(t.includes('mientras estoy en combate')||t.includes('cuando estoy en combate'))warn.push(`${s.slot} tiene una condición demasiado amplia.`);if(t.match(/inflige\s+\d|infliges\s+\d|causa\s+\d|daño directo/))warn.push(`${s.slot} parece infligir daño directo. Revisar para no reemplazar Técnicas.`)});if(state.structure.profile==='fragil'&&!state.skills.some(s=>s.defensive))bad.push('Perfil Frágil requiere al menos una habilidad marcada como evasión/mitigación.');if(state.structure.profile==='titan'&&state.skills.filter(s=>s.offensive).length>2)bad.push('Perfil Titán no puede tener más de 2 habilidades ofensivas principales.');if(psUsed()>psAvail())warn.push(`Las habilidades usan ${psUsed()} PS, pero solo hay ${psAvail()} PS disponibles.`);if(equipTotal()>100)warn.push(`El equipo supera 100 L. Actualmente: ${equipTotal()} L.`);if(!bad.length)ok.push('La Senda cumple los requisitos principales.');return{bad,warn,ok}}
function progress(){let n=0;if(state.identity.name&&state.identity.fantasy)n++;if(state.structure.energies.length)n++;if(state.concepts.length===3)n++;if(state.affines.length===3&&state.opposed.length===2)n++;if(state.equipment.length)n++;if(state.skills.every(s=>s.name))n++;if(!validate().bad.length)n++;if(exportText().length>200)n++;return Math.round(n/8*100)}
function render(){const [id,label,desc]=steps[state.step];document.getElementById('panelTitle').textContent=label;document.getElementById('panelDesc').textContent=desc;document.getElementById('steps').innerHTML=steps.map((s,i)=>`<button class="step ${i===state.step?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span><span>${s[1]}</span></button>`).join('');document.getElementById('content').innerHTML=renderStep(id);hydrate(id);document.getElementById('prevBtn').disabled=state.step===0;document.getElementById('nextBtn').textContent=state.step===steps.length-1?'Listo':'Siguiente';renderSummary()}
function go(i){state.step=Math.max(0,Math.min(steps.length-1,i));save();render()}function inputField(label,path,value,type='input',hint=''){const id=path.replaceAll('.','_');return`<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function renderStep(id){if(id==='identity')return`<div class="grid two">${inputField('Nombre','identity.name',state.identity.name,'input','Ej: El Comandante')}${inputField('Subtítulo','identity.subtitle',state.identity.subtitle,'input','Ej: El que sostiene la línea')}${inputField('Frase','identity.quote',state.identity.quote,'input','Una frase corta de identidad')}${inputField('Fantasía central','identity.fantasy',state.identity.fantasy,'textarea','Una oración clara')}${inputField('¿Qué hace mejor que nadie?','identity.best',state.identity.best,'textarea')}${inputField('¿Cómo lo hace?','identity.method',state.identity.method,'textarea')}${inputField('¿Qué le cuesta?','identity.weakness',state.identity.weakness,'textarea')}</div>`;if(id==='structure')return`<h3 class="section-title">Energías</h3><div class="cards">${energies.map(e=>card(e,state.structure.energies.includes(e),`toggleEnergy('${js(e)}')`,'Máximo 3 energías.')).join('')}</div><h3 class="section-title">Perfil de Vitalidad</h3><div class="cards">${Object.entries(profiles).map(([k,p])=>`<div class="choice ${state.structure.profile===k?'selected':''}" onclick="setProfile('${k}')"><h3>${p.name}</h3><p>${p.cost} PCS · +${p.res} Resistencia por nivel desde nivel 1.</p><div style="margin-top:8px"><span class="badge ${k==='titan'?'warn':'blue'}">${p.rule}</span></div></div>`).join('')}</div><div class="alert ok" style="margin-top:14px">PS disponibles: <strong>${psAvail()}</strong></div>`;if(id==='concepts')return`<div class="field"><label>Concepto personalizado</label><input id="customConcept" value="${esc(state.customConcept)}" placeholder="Opcional"><div class="hint">Debe ser un área de dominio, no un bono.</div></div><div class="cards" style="margin-top:14px">${conceptList.map(([c,t])=>card(c,state.concepts.includes(c),`toggleLimit('concepts','${js(c)}',3)`,t)).join('')}${state.customConcept?card(state.customConcept,state.concepts.includes(state.customConcept),`toggleLimit('concepts','${js(state.customConcept)}',3)`,'Personalizado'):''}</div>`;if(id==='affinities')return`<h3 class="section-title">Afines — elige 3</h3><div class="cards">${affinityList.map(a=>card(a,state.affines.includes(a),`toggleLimit('affines','${js(a)}',3)`,'Reduce coste en PX.')).join('')}</div><h3 class="section-title">Contrarias — elige 2</h3><div class="cards">${affinityList.map(a=>card(a,state.opposed.includes(a),`toggleLimit('opposed','${js(a)}',2)`,'Aumenta coste en PX.')).join('')}</div>`;if(id==='equipment')return renderEquipmentStep();if(id==='skills')return`<div class="alert warn">Abre cada habilidad para editarla. Usa “Módulos” para elegir rasgos desde una subventana.</div><div class="skill-list" style="margin-top:14px">${state.skills.map((s,i)=>skillCard(s,i)).join('')}</div>`;if(id==='review'){const v=validate();return`<div class="alert-list">${v.ok.map(x=>`<div class="alert ok">${x}</div>`).join('')}${v.bad.map(x=>`<div class="alert bad">${x}</div>`).join('')}${v.warn.map(x=>`<div class="alert warn">${x}</div>`).join('')}</div>`}if(id==='export')return`<div class="top-actions" style="justify-content:flex-start;margin-bottom:12px"><button class="btn primary" onclick="copyExport()">Copiar texto</button><button class="btn" onclick="downloadTxt()">Descargar TXT</button><button class="btn" onclick="downloadJson()">Descargar JSON</button></div><textarea class="exportbox" id="exportBox">${esc(exportText())}</textarea>`}
function card(title,selected,onclick,desc){return`<div class="choice ${selected?'selected':''}" onclick="${onclick}"><h3>${esc(title)}</h3><p>${esc(desc||'')}</p></div>`}function skillCard(s,i){return`<div class="skill-card"><div class="skill-summary"><div><strong>${s.slot} — ${esc(s.name||'Sin nombre')}</strong><div class="hint">${s.type} · ${Number(s.ps)||0}/${s.cap} PS</div></div><div class="top-actions"><button class="btn small" onclick="toggleSkill(${i})">${s.open?'Cerrar':'Abrir'}</button><button class="btn small primary" onclick="openModules(${i})">Módulos</button></div></div><div class="skill-body ${s.open?'':'collapsed'}"><div class="grid two"><div class="field"><label>Nombre</label><input id="sk_${i}_name" value="${esc(s.name)}"></div><div class="field"><label>Tipo</label><select id="sk_${i}_type">${['Pasiva','Reactiva','Acción','Interacción'].map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>CUÁNDO</label><textarea id="sk_${i}_when">${esc(s.when)}</textarea></div><div class="field"><label>QUÉ HACE</label><textarea id="sk_${i}_does">${esc(s.does)}</textarea></div><div class="field"><label>CUÁNTO CUESTA</label><input id="sk_${i}_cost" value="${esc(s.cost)}"></div><div class="field"><label>PS usados</label><input id="sk_${i}_ps" type="number" value="${Number(s.ps)||0}"></div><div class="field" style="grid-column:1/-1"><label>DESCRIPCIÓN</label><textarea id="sk_${i}_desc">${esc(s.desc)}</textarea></div></div><div class="skill-actions"><label class="badge"><input type="checkbox" id="sk_${i}_offensive" ${s.offensive?'checked':''}> Ofensiva principal</label><label class="badge"><input type="checkbox" id="sk_${i}_defensive" ${s.defensive?'checked':''}> Evasión / mitigación</label></div></div></div>`}
function hydrate(id){if(id==='identity'){['name','subtitle','quote','fantasy','best','method','weakness'].forEach(k=>bind(`identity_${k}`,v=>state.identity[k]=v))}if(id==='concepts')bind('customConcept',v=>state.customConcept=v);if(id==='equipment'){bind('equipSearch',v=>state.equipSearch=v);const fc=document.getElementById('equipFilterCat');if(fc)fc.onchange=e=>{state.equipFilterCat=e.target.value;save();render();};}if(id==='skills'){state.skills.forEach((s,i)=>{['name','when','does','cost','desc'].forEach(k=>bind(`sk_${i}_${k}`,v=>state.skills[i][k]=v));bind(`sk_${i}_ps`,v=>state.skills[i].ps=Number(v)||0);const type=document.getElementById(`sk_${i}_type`);if(type)type.onchange=e=>{state.skills[i].type=e.target.value;save();renderSummary()};const off=document.getElementById(`sk_${i}_offensive`);if(off)off.onchange=e=>{state.skills[i].offensive=e.target.checked;save();renderSummary()};const def=document.getElementById(`sk_${i}_defensive`);if(def)def.onchange=e=>{state.skills[i].defensive=e.target.checked;save();renderSummary()}})}}function bind(id,fn){const el=document.getElementById(id);if(!el)return;el.oninput=e=>{fn(e.target.value);save();renderSummary()}}
function toggleSkill(i){state.skills[i].open=!state.skills[i].open;save();render()}function toggleEnergy(e){const a=state.structure.energies,i=a.indexOf(e);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(e);save();render()}function setProfile(k){state.structure.profile=k;save();render()}function toggleLimit(key,val,max){const a=state[key],i=a.indexOf(val);if(i>=0)a.splice(i,1);else if(a.length<max)a.push(val);save();render()}
function renderEquipmentStep(){
  const cat=state.equipFilterCat||'Todas';
  const q=(state.equipSearch||'').toLowerCase();
  const list=equipmentCatalog.filter(it=>(cat==='Todas'||it.cat===cat) && (!q || (`${it.name} ${it.cat} ${it.detail}`).toLowerCase().includes(q)));
  return `<div class="alert ok">El equipo inicial tiene presupuesto de <strong>100 L</strong>. Puedes añadir elementos del catálogo o crear objetos personalizados.</div>
  <div class="grid two" style="margin-top:12px">
    <div class="field"><label>Buscar en catálogo</label><input id="equipSearch" value="${esc(state.equipSearch||'')}" placeholder="espada, kit, ropa, cuerda..."></div>
    <div class="field"><label>Categoría</label><select id="equipFilterCat">${equipmentCats.map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  </div>
  <h3 class="section-title">Catálogo</h3>
  <div class="module-grid">${list.slice(0,80).map((it,idx)=>`<div class="module-card"><h4>${esc(it.name)}</h4><p><strong>${esc(it.cat)}</strong> · ${esc(it.detail)}</p><div class="module-footer"><span class="badge blue">${formatCost(it.cost)} L</span><span class="badge">Cap. ${it.capacity}</span><button class="btn small primary" onclick="addCatalogItem('${js(it.name)}')">Añadir</button></div></div>`).join('')||'<div class="alert warn">No hay resultados.</div>'}</div>
  <h3 class="section-title">Objeto personalizado</h3>
  <div class="grid three">
    <div class="field"><label>Nombre</label><input id="equipName" placeholder="Objeto personalizado"></div>
    <div class="field"><label>Coste</label><input id="equipCost" type="number" min="0" step="0.01" placeholder="0"></div>
    <div class="field"><label>Capacidad</label><input id="equipCap" type="number" min="0" step="0.5" placeholder="0"></div>
  </div>
  <div class="field" style="margin-top:10px"><label>Notas</label><input id="equipDetail" placeholder="Daño, defensa, uso o descripción breve"></div>
  <button class="btn primary" style="margin-top:10px" onclick="addCustomEquip()">Agregar personalizado</button>
  <div class="alert ${equipTotal()>100?'bad':'ok'}" style="margin-top:12px">Lectos gastados: <strong>${formatCost(equipTotal())} / 100 L</strong> · Capacidad total: <strong>${formatCost(equipCapacity())}</strong></div>
  <h3 class="section-title">Equipo elegido</h3>
  <div class="skill-list">${state.equipment.length?state.equipment.map((e,i)=>`<div class="skill-card"><div class="skill-summary"><div><strong>${esc(e.name)}</strong><div class="hint">${esc(e.cat||'Personalizado')} · ${formatCost(e.cost||0)} L · Cap. ${formatCost(e.capacity||0)}${e.detail?' · '+esc(e.detail):''}</div></div><button class="btn small" onclick="removeEquip(${i})">Eliminar</button></div></div>`).join(''):'<div class="alert warn">Aún no hay equipo.</div>'}</div>`;
}
function formatCost(n){return Number(n||0).toLocaleString('es-CL',{maximumFractionDigits:2})}
function equipCapacity(){return state.equipment.reduce((a,e)=>a+(Number(e.capacity)||0),0)}
function addCatalogItem(name){
  const it=equipmentCatalog.find(x=>x.name===name);
  if(it) state.equipment.push({...it});
  save();render();
}
function addCustomEquip(){
  const name=document.getElementById('equipName').value.trim();
  const cost=Number(document.getElementById('equipCost').value)||0;
  const capacity=Number(document.getElementById('equipCap').value)||0;
  const detail=document.getElementById('equipDetail').value.trim();
  if(name) state.equipment.push({cat:'Personalizado',name,cost,capacity,detail});
  save();render();
}
function addEquip(){addCustomEquip()}
function removeEquip(i){state.equipment.splice(i,1);save();render()}

function renderSummary(){document.getElementById('progress').style.width=progress()+'%';document.getElementById('sumName').textContent=state.identity.name||'—';const p=profiles[state.structure.profile];document.getElementById('sumProfile').textContent=`${p.name} (+${p.res}/nivel)`;document.getElementById('sumEnergies').textContent=state.structure.energies.join(', ')||'—';document.getElementById('sumPCS').textContent=`${pcs()} / 30`;document.getElementById('sumPS').textContent=`${psAvail()} disponibles · ${psUsed()} usados`;document.getElementById('sumConcepts').innerHTML=state.concepts.length?state.concepts.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="hint">—</span>';const v=validate(),items=[...v.bad.slice(0,3).map(x=>['bad',x]),...v.warn.slice(0,2).map(x=>['warn',x])];document.getElementById('sumAlerts').innerHTML=items.length?items.map(([c,x])=>`<div class="alert ${c}">${esc(x)}</div>`).join(''):'<div class="alert ok">Sin errores críticos.</div>'}
function openModules(i){currentSkill=i;currentTab=state.skills[i].type in modules?state.skills[i].type:(state.skills[i].type==='Acción'?'Acción — Apoyo':'Pasiva');document.getElementById('moduleModal').classList.add('open');renderModules()}function closeModal(){document.getElementById('moduleModal').classList.remove('open');currentSkill=null}function renderModules(){const skill=state.skills[currentSkill];document.getElementById('modalTitle').textContent=`Módulos — ${skill.slot}`;document.getElementById('moduleTabs').innerHTML=Object.keys(modules).map(t=>`<button class="tab ${t===currentTab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');document.getElementById('moduleGrid').innerHTML=modules[currentTab].map((m,idx)=>`<div class="module-card"><h4>${esc(m[0])}</h4><p>${esc(m[2])}</p><div class="module-footer"><span class="badge ${m[1]<0?'warn':'blue'}">${m[1]} PS</span><button class="btn small primary" onclick="addModule('${currentTab}',${idx})">Añadir</button></div></div>`).join('');renderSelectedModules()}function setTab(t){currentTab=t;renderModules()}function addModule(cat,idx){const m=modules[cat][idx];state.skills[currentSkill].modules.push({cat,name:m[0],ps:m[1],text:m[2],condition:'',scope:'Específica'});save();renderSelectedModules();renderSummary()}function removeModule(idx){state.skills[currentSkill].modules.splice(idx,1);save();renderSelectedModules();renderSummary()}function renderSelectedModules(){const skill=state.skills[currentSkill],total=skill.modules.reduce((a,m)=>a+Number(m.ps||0),0);document.getElementById('modalTotal').textContent=`Total módulos: ${total} PS`;document.getElementById('selectedModules').innerHTML=skill.modules.length?skill.modules.map((m,i)=>`<div class="selected-module"><div class="selected-module-head"><div><strong>${esc(m.name)}</strong> <span class="badge ${m.ps<0?'warn':'blue'}">${m.ps} PS</span></div><button class="btn small" onclick="removeModule(${i})">Eliminar</button></div><div class="hint">${esc(m.text)}</div><div class="condition-box"><input value="${esc(m.condition)}" placeholder="Condición concreta: cuándo empieza y termina" oninput="updateModuleCondition(${i},this.value)"><select onchange="updateModuleScope(${i},this.value)">${['Específica','General','Sin condición'].map(x=>`<option ${m.scope===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`).join(''):'<div class="alert warn">No hay módulos seleccionados.</div>'}function updateModuleCondition(i,v){state.skills[currentSkill].modules[i].condition=v;save()}function updateModuleScope(i,v){state.skills[currentSkill].modules[i].scope=v;save()}function clearModules(){state.skills[currentSkill].modules=[];save();renderSelectedModules();renderSummary()}function applyModules(){const skill=state.skills[currentSkill],total=skill.modules.reduce((a,m)=>a+Number(m.ps||0),0);skill.ps=Math.max(0,total);skill.does=skill.modules.map(m=>`${m.name}: ${m.text}${m.condition?' Condición: '+m.condition+'.':''}`).join('\n');skill.offensive=skill.modules.some(m=>m.cat==='Acción — Ofensiva táctica'||m.name.includes('estado')||m.name.includes('Reducir Defensa')||m.name.includes('Derribo')||m.name.includes('Marcar objetivo')||m.name.includes('Efecto Cumbre táctico'));skill.defensive=skill.modules.some(m=>m.cat==='Reactiva'||m.name.includes('Defensa')||m.name.includes('Interposición')||m.name.includes('Resistir')||m.name.includes('Barrera')||m.name.includes('Curación')||m.name.includes('Estabilizar')||m.name.includes('Revivir')||m.name.includes('Inmunidad')||m.name.includes('Efecto Cumbre defensivo'));skill.open=true;save();closeModal();render()}
function exportText(){const p=profiles[state.structure.profile];return`# ${state.identity.name||'SENDA SIN NOMBRE'}\n\n${state.identity.subtitle||''}\n${state.identity.quote?'"'+state.identity.quote+'"':''}\n\n## Identidad de la Senda\n\nFantasía: ${state.identity.fantasy||'—'}\nQué hace mejor que nadie: ${state.identity.best||'—'}\nCómo lo hace: ${state.identity.method||'—'}\nQué le cuesta: ${state.identity.weakness||'—'}\n\n## Estructura\n\nConceptos: ${state.concepts.join(', ')||'—'}\nEnergía: ${state.structure.energies.join(', ')||'—'}\nPerfil de Vitalidad: ${p.name} — +${p.res} Resistencia por nivel desde nivel 1\nCoste Vitalidad: ${profiles[state.structure.profile].cost}\nPS disponibles: ${psAvail()}\nEquipo: ${state.equipment.length?state.equipment.map(e=>`${e.name} (${formatCost(e.cost||0)} L${e.detail?' · '+e.detail:''})`).join(', '):'—'}\nAfines: ${state.affines.join(', ')||'—'}\nContrarias: ${state.opposed.join(', ')||'—'}\n\n## Habilidades\n\n${state.skills.map(s=>`### ${s.slot} — ${s.name||'Sin nombre'}\nTipo: ${s.type}\nPS: ${Number(s.ps)||0} / ${s.cap}\n\nCUÁNDO: ${s.when||'—'}\n\nQUÉ HACE:\n${s.does||'—'}\n\nCUÁNTO CUESTA: ${s.cost||'—'}\n\nDESCRIPCIÓN:\n${s.desc||'—'}\n`).join('\n')}\n## Revisión automática\n\n${[...validate().ok.map(x=>'✓ '+x),...validate().bad.map(x=>'✗ '+x),...validate().warn.map(x=>'! '+x)].join('\n')}`}function copyExport(){const box=document.getElementById('exportBox');navigator.clipboard.writeText(box?box.value:exportText())}function downloadTxt(){download('senda_papa.txt',exportText(),'text/plain')}function downloadJson(){download('senda_papa.json',JSON.stringify(state,null,2),'application/json')}function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
document.getElementById('prevBtn').onclick=()=>go(state.step-1);document.getElementById('nextBtn').onclick=()=>go(state.step+1);document.getElementById('saveBtn').onclick=()=>{save();alert('Guardado en este navegador.')};document.getElementById('resetBtn').onclick=()=>{if(confirm('¿Reiniciar todo?')){localStorage.removeItem('papa_senda_builder_v7');location.reload()}};document.getElementById('importBtn').onclick=()=>{const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const file=input.files[0],reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);save();render()}catch(e){alert('JSON inválido.')}};reader.readAsText(file)};input.click()};document.getElementById('moduleModal').addEventListener('click',e=>{if(e.target.id==='moduleModal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body>
</html>
